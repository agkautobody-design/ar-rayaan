    post:
      tags: [meetups]
      security: [{ bearer: [] }]
      summary: 'Cancel my meet-up (or the rest of its series). Attendees are notified.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                scope: { type: string }
      responses:
        '204': { description: Cancelled }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/meetups/{id}/rsvp:
    put:
      tags: [meetups]
      security: [{ bearer: [] }]
      summary: 'Sign up (or join the waiting list when full). A guardian can add a child profile only where the organiser allows it.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acknowledge]
              properties:
                acknowledge: { type: boolean }
                childProfileId: { type: string, format: uuid }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [meetups]
      security: [{ bearer: [] }]
      summary: 'Cancel my sign-up (and my children''s). The next person on the waiting list moves up.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: childProfileId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Cancelled }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/notifications:
    get:
      tags: [notifications]
      security: [{ bearer: [] }]
      summary: 'Poll my notifications (short codes and ids only). Use ?after= with the last createdAt for new ones.'
      parameters:
        - { name: after, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: unreadOnly, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/notifications/read:
    post:
      tags: [notifications]
      security: [{ bearer: [] }]
      summary: 'Mark notifications read (ids, or all).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string, format: uuid } }
                all: { type: boolean }
      responses:
        '204': { description: Marked }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
    Session:
      description: Signed in
      content:
        application/json:
          schema:
            type: object
            properties:
              token: { type: string }
              expiresAt: { type: string, format: date-time }
              isNewAccount: { type: boolean }
              user:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  role: { type: string, enum: [member, moderator, admin] }
