      parameters:
        - { name: city, in: query, required: false, schema: { type: string } }
        - { name: country, in: query, required: false, schema: { type: string } }
        - { name: audience, in: query, required: false, schema: { type: string } }
        - { name: after, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      tags: [meetups]
      security: [{ bearer: [] }]
      summary: 'Create a meet-up (adults; public venue; a cafe must be confirmed halal). Published at once only for a verified organiser; otherwise it waits for review.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, venueKind, venueName, city, country, startsAt, audience, minorsPolicy, acknowledgeOrganiserRules]
              properties:
                title: { type: string }
                venueKind: { type: string }
                venueName: { type: string }
                city: { type: string }
                country: { type: string }
                startsAt: { type: string, format: date-time }
                audience: { type: string }
                minorsPolicy: { type: string }
                acknowledgeOrganiserRules: { type: boolean }
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
