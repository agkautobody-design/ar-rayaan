      security: [{ bearer: [] }]
      summary: 'Meet-ups I organise or have signed up for.'
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
  /v1/meetups/reminders:
    get:
      tags: [meetups]
      security: [{ bearer: [] }]
      summary: 'Upcoming meet-ups I am going to in the next 7 days, with reminder times.'
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
  /v1/meetups/{id}:
    get:
      tags: [meetups]
      security: [{ bearer: [] }]
      summary: 'One meet-up. The organiser also sees adult attendee names and a count of children; nobody sees a child name.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    patch:
      tags: [meetups]
      security: [{ bearer: [] }]
      summary: 'Edit my meet-up. Changes to an unverified organiser''s published meet-up send it back for review.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                startsAt: { type: string, format: date-time }
                capacity: { type: integer }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
