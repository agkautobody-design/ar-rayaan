name: ar_rayaan
description: "Ar-Rayaan — Your Gateway to Allah."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  http: ^1.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  qr_flutter: ^4.1.0
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.2
  url_launcher: ^6.3.1
  hijri: ^3.0.1
  adhan: ^2.0.0+1
  geolocator: ^14.1.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  web: ^1.1.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  path_provider: ^2.1.6
  wakelock_plus: ^1.8.0
  crypto: ^3.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/tiles/
    - assets/quran/
    - assets/academy/
    - assets/hadith/
    - assets/adhkar/
    - assets/noor/
    - assets/stories/
    - assets/family/
    - assets/guides/
    - assets/games/
    - assets/feelings/
    - assets/majlis/
    - assets/audio/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-400.ttf
        - asset: assets/fonts/PlayfairDisplay-500.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-600.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-700.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-300.ttf
          weight: 300
        - asset: assets/fonts/Inter-400.ttf
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-400.ttf
        - asset: assets/fonts/Amiri-700.ttf
          weight: 700
        - asset: assets/fonts/Amiri-Italic.ttf
          style: italic
