name: ar_rayaan
description: "Ar-Rayaan — Your Gateway to Allah."
publish_to: "none"
version: 0.7.0+7

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  http: ^1.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  qr_flutter: ^4.1.0
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.2
  url_launcher: ^6.3.1
  hijri: ^3.0.1
  adhan: ^2.0.0+1
  geolocator: ^14.1.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  web: ^1.1.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  path_provider: ^2.1.6
  wakelock_plus: ^1.8.0
  crypto: ^3.0.7
  # Keeps a person's own AI key in the platform's secure store (Keystore /
  # Keychain). Never used in a browser: see ApiKeyVault.
  flutter_secure_storage: ^10.3.4
  # Native adhan notifications and live compass (worship wave). Pinned to
  # versions verified on pub.dev on 2026-10-20. Every call site is behind a
  # conditional import or a platform check, so the web build never runs them.
  flutter_local_notifications: 22.3.2
  timezone: 0.11.2
  flutter_compass: 0.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/tiles/
    - assets/quran/
    - assets/quran/translations/
    - assets/academy/
    - assets/academy/lessons_v3/
    - assets/academy/phrases/
    - assets/hadith/
    - assets/adhkar/
    - assets/noor/
    - assets/stories/
    - assets/stories/layers/
    - assets/stories/earlier/
    - assets/family/
    - assets/guides/
    - assets/games/
    - assets/games/ludo/
    - assets/games/chess/pieces/
    - assets/games/chess/squares/
    - assets/games/chess/boards/
    - assets/games/art/
    - assets/feelings/
    - assets/majlis/
    - assets/share/
    - assets/finance/
    - assets/system/
    - assets/audio/
    - assets/qa/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-400.ttf
        - asset: assets/fonts/PlayfairDisplay-500.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-600.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-700.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-300.ttf
          weight: 300
        - asset: assets/fonts/Inter-400.ttf
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-400.ttf
        - asset: assets/fonts/Amiri-700.ttf
          weight: 700
        - asset: assets/fonts/Amiri-Italic.ttf
          style: italic
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
