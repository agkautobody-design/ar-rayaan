name: PR Check

# Compiles, analyzes and tests every pull request before it can reach main.
# Results are posted back to the PR as a comment so they can be read without
# downloading logs.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

env:
  # Identical to the flags in build-web.yml, so a PR that passes here cannot
  # be rejected by the deploy. Keep them in sync.
  ANALYZE_FLAGS: --fatal-warnings --no-fatal-infos

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned for reproducible builds (the version CI resolved on 2026-10-20).
          # Bump deliberately, in both workflows.
          flutter-version: 3.47.7
          cache: true

      - name: Toolchain versions
        run: flutter --version 2>&1 | tee flutter.version

      - name: Install dependencies
        id: pub
        run: flutter pub get 2>&1 | tee pub.log
        continue-on-error: true

      # `flutter pub get` rewrites pubspec.lock when it is out of date. That
      # is NOT a failure here; instead the regenerated lock is attached to the
      # run (artifact) so a maintainer can commit it. Never hand-edit the lock.
      - name: Detect pubspec.lock drift
        id: lock
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            git diff -- pubspec.lock > pubspec.lock.diff
          fi

      - name: Upload regenerated pubspec.lock
        if: steps.lock.outputs.drift == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock-regenerated
          path: |
            pubspec.lock
            pubspec.lock.diff

      - name: Analyze
        id: analyze
        run: |
          set -o pipefail
          flutter analyze $ANALYZE_FLAGS 2>&1 | tee analyze.log
        continue-on-error: true

      - name: Test
        id: test
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.log
        continue-on-error: true

      - name: Build web (compile check)
        id: build
        run: |
          set -o pipefail
          flutter build web --release 2>&1 | tee build.log
        continue-on-error: true

      - name: Post results
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LOCK_DRIFT: ${{ steps.lock.outputs.drift }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## PR Check — ${GITHUB_SHA::7}"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| pub get | ${{ steps.pub.outcome }} |"
            echo "| analyze | ${{ steps.analyze.outcome }} |"
            echo "| test | ${{ steps.test.outcome }} |"
            echo "| build web | ${{ steps.build.outcome }} |"
            echo ""
            echo "Toolchain: \`$(head -n 2 flutter.version | tr '\n' ' ')\`"
            echo ""
            if [ "$LOCK_DRIFT" = "true" ]; then
              echo "**pubspec.lock is out of date.** \`flutter pub get\` regenerated it. Download the \`pubspec-lock-regenerated\` artifact from ${RUN_URL} and commit it (not a failure)."
              echo ""
              echo "<details><summary>pubspec.lock diff (first 120 lines)</summary>"
              echo ""
              echo '```diff'
              head -n 120 pubspec.lock.diff
              echo '```'
              echo "</details>"
              echo ""
            fi
            echo "<details><summary>pub get (tail)</summary>"
            echo ""
            echo '```'
            tail -n 25 pub.log 2>/dev/null
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>analyze errors and warnings</summary>"
            echo ""
            echo '```'
            grep -E "^ *(error|warning) •" analyze.log 2>/dev/null | head -n 150
            tail -n 3 analyze.log 2>/dev/null
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>test failures</summary>"
            echo ""
            echo '```'
            # The exception text is printed BEFORE the [E] line, so keep context on both sides.
            grep -B 45 -A 12 "\[E\]" test.log 2>/dev/null | head -n 500
            grep -E "Some tests failed|All tests passed" test.log 2>/dev/null | tail -n 1
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>build web (tail)</summary>"
            echo ""
            echo '```'
            grep -E "Error|error:" build.log 2>/dev/null | head -n 60
            tail -n 10 build.log 2>/dev/null
            echo '```'
            echo "</details>"
          } > report.md
          gh pr comment "$PR" --body-file report.md

      - name: Fail if any step failed
        if: steps.pub.outcome != 'success' || steps.analyze.outcome != 'success' || steps.test.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1
