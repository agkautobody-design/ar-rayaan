name: Ar-Rayaan CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
      - run: flutter pub get
      # Same flags as build-web.yml / pr-check.yml (keep them in sync):
      # warnings are fatal, the 323 pre-existing infos are not.
      - run: flutter analyze --fatal-warnings --no-fatal-infos
      - run: flutter gen-l10n

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter test

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build ios --release --no-codesign
