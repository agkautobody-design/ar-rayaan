<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Pinch-zoom must stay possible (accessibility). Without this tag the
       Flutter web engine injects one with user-scalable=no. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ar-Rayaan — Your Gateway to Allah. Prayer times, Qur'an, du'as, and your daily journey.">
  <meta name="theme-color" content="#05090F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ar-Rayaan">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ar-Rayaan</title>
  <link rel="manifest" href="manifest.json">

  <!--
    CONTENT-SECURITY-POLICY REVIEW (not enforced here on purpose: a wrong CSP
    breaks the live site and cannot be tested from CI). To enforce, send it as
    a response header from Render, in Report-Only mode first. What the app
    genuinely needs, as of this review:
      script-src   'self' 'wasm-unsafe-eval'   (CanvasKit is bundled under canvaskit/,
                   built with --no-web-resources-cdn; no gstatic script needed)
      connect-src  'self' https://*.googleapis.com https://*.firebaseio.com
                   https://*.firebaseapp.com https://firebaseinstallations.googleapis.com
                   https://api.aladhan.com https://api.gold-api.com
                   https://cdn.jsdelivr.net https://latest.currency-api.pages.dev
                   https://overpass-api.de https://nominatim.openstreetmap.org
                   https://raw.githubusercontent.com https://fonts.gstatic.com
                   https://api.groq.com https://api.x.ai https://openrouter.ai
                   https://everyayah.com https://cdn.islamic.network
                   https://server13.mp3quran.net
      img-src      'self' data: blob: https://*.tile.openstreetmap.org
                   https://cdn.islamic.network
      media-src    'self' blob: https://everyayah.com https://cdn.islamic.network
                   https://server13.mp3quran.net
      font-src     'self' https://fonts.gstatic.com
      style-src    'self' 'unsafe-inline'      (boot splash + Flutter inline styles)
      worker-src   'self' blob:
      frame-src    https://*.firebaseapp.com   (Firebase Auth popup/iframe)
      object-src   'none'; base-uri 'self'; frame-ancestors 'self'
    Re-check this list whenever a new host is added to the app.
  -->
</head>
<body style="margin:0;background:#05090F;">
  <!-- Branded boot splash — covered by the Flutter view once the first
       frame renders. Keeps first paint on-brand instead of a white flash. -->
  <div id="ar-boot" style="position:fixed;inset:0;background:#05090F;z-index:0;overflow:hidden;">
    <img src="assets/assets/images/splash.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(40px) brightness(0.45);" />
    <img src="assets/assets/images/splash.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0.96;" />
    <div style="position:absolute;left:50%;bottom:64px;transform:translateX(-50%);width:120px;height:2px;background:rgba(212,175,55,0.25);border-radius:2px;overflow:hidden;">
      <div style="width:40%;height:100%;background:#D4AF37;border-radius:2px;animation:ar-load 1.4s ease-in-out infinite;"></div>
    </div>
    <style>@keyframes ar-load{0%{margin-left:-40%}100%{margin-left:100%}}</style>
    <!-- Shown by the watchdog script below if the app has not drawn its first
         frame after 20 s, or if the app script fails to load at all. -->
    <div id="ar-boot-msg" role="alert" hidden
         style="position:absolute;left:0;right:0;bottom:110px;padding:0 24px;text-align:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#F3E9D2;">
      <p id="ar-boot-text" style="margin:0 0 14px;font-size:16px;line-height:1.5;"></p>
      <button id="ar-boot-retry" type="button"
              style="min-height:44px;min-width:140px;padding:10px 22px;font-size:16px;font-weight:600;color:#05090F;background:#D4AF37;border:0;border-radius:24px;cursor:pointer;">Try again</button>
    </div>
  </div>
  <noscript>Ar-Rayaan needs JavaScript to run.</noscript>

  <!-- Offline shell and cache-busting.

       The web app registers ar_sw.js, a small worker that keeps the app's own
       files so the app opens again with no internet once it has been opened
       online in this browser. It is NETWORK FIRST: whenever a connection
       exists the newest build is fetched and kept, and the kept copy is used
       only when the network fails or takes more than 6 seconds. That keeps the
       reason the earlier version had no caching worker (a stale build means
       stale content and stale safety text) while ending the "No internet"
       browser page on reopen. Flutter's own worker is not used: it is the
       deprecated stub that removes itself (see web/flutter_bootstrap.js).

       Every deploy is built with a unique build number (the workflow run
       number), published in version.json. When it differs from the build this
       browser last ran, drop the old Flutter-era workers and the caches of
       earlier builds (not the offline shell, not recitation the person chose
       to download) and reload once. Any failure here is ignored: the app just
       loads. -->
  <script>
    (function () {
      var SW = 'ar_sw.js';
      // The Firebase script the app loads at start-up; the worker keeps a copy
      // so the app can also start with no internet.
      function isFirebaseScript(u) {
        return /^https:\/\/www\.gstatic\.com\/firebasejs\/[^?#]+\.js(\?|#|$)/.test(String(u));
      }
      function sameOrigin(u) {
        try { return new URL(u, location.href).origin === location.origin; }
        catch (e) { return false; }
      }
      try {
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
          window.addEventListener('load', function () {
            // The copy is refreshed after the first frame, when the list of
            // files the app really used is known.
            navigator.serviceWorker.register(SW, { updateViaCache: 'none' }).then(function (reg) {
              function warm() {
                var urls = [];
                try {
                  urls = performance.getEntriesByType('resource')
                    .map(function (e) { return e.name; })
                    .filter(function (u) { return sameOrigin(u) || isFirebaseScript(u); });
                } catch (e) {}
                var w = reg && (reg.active || reg.waiting || reg.installing);
                if (w && urls.length) w.postMessage({ type: 'cache-urls', urls: urls });
              }
              window.addEventListener('flutter-first-frame', function () { setTimeout(warm, 4000); });
              setTimeout(warm, 15000);
            }).catch(function () {});
          });
        }
      } catch (e) {}
      try {
        fetch('version.json?cb=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (v) {
            if (!v) return;
            var current = String(v.version) + '+' + String(v.build_number);
            var seen = null;
            try { seen = localStorage.getItem('ar.build'); } catch (e) {}
            try { localStorage.setItem('ar.build', current); } catch (e) {}
            if (seen === null || seen === current) return;
            var jobs = [];
            if (window.caches && caches.keys) {
              // Caches named ar-dl-* hold recitation the person chose to
              // download; recorded audio does not change with the app, so
              // they are kept (Settings > Downloads can delete them). The
              // offline shell (ar-app-*) replaces its own files, network
              // first, so it is kept too.
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.filter(function (k) {
                  return k.indexOf('ar-dl-') !== 0 && k.indexOf('ar-app-') !== 0;
                }).map(function (k) { return caches.delete(k); }));
              }));
            }
            Promise.all(jobs).then(function () { location.reload(); });
          })
          .catch(function () {});
      } catch (e) {}
    })();
  </script>

  <!-- Boot watchdog. CanvasKit is bundled (no CDN), but a slow network, a
       blocked file or a failed script must never leave the splash up forever
       with no word. After 20 s without a first frame, or at once if the app
       script fails to load, show a message and a Try again button. The
       splash keeps waiting: if the app does arrive late it simply covers the
       message. -->
  <script>
    (function () {
      var shown = false;
      var started = false;
      function el(id) { return document.getElementById(id); }
      window.addEventListener('flutter-first-frame', function () {
        started = true;
        var m = el('ar-boot-msg');
        if (m) m.hidden = true;
      });
      function show(text) {
        if (started) return;
        var m = el('ar-boot-msg');
        var t = el('ar-boot-text');
        if (!m || !t) return;
        t.textContent = text;
        m.hidden = false;
        shown = true;
      }
      var retry = el('ar-boot-retry');
      if (retry) retry.addEventListener('click', function () { location.reload(); });
      function offline() {
        try { return navigator.onLine === false; } catch (e) { return false; }
      }
      window.arBootFail = function () {
        show(offline()
          ? 'You are offline, and this browser has no saved copy of Ar-Rayaan yet. Connect once and open the app, and it will open without internet after that.'
          : 'Ar-Rayaan could not start. Check your internet connection and try again.');
      };
      setTimeout(function () {
        if (!started && !shown) {
          show(offline()
            ? 'You are offline. Ar-Rayaan is still looking for its saved copy. If nothing appears, connect once and open the app, and it will open without internet after that.'
            : 'Ar-Rayaan is taking longer than expected to start. Check your internet connection, then try again.');
        }
      }, 12000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async onerror="window.arBootFail && window.arBootFail()"></script>
</body>
</html>
