include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - test/auth_test.dart
    - test/hadith_adhkar_test.dart
    - test/home_tiles_test.dart
    - test/menu_attribution_test.dart
    - test/noor_journey_test.dart
    - test/prayer_test.dart
    - test/qibla_calendar_test.dart
    - test/quran_test.dart
    - test/session_profile_test.dart
    - test/share_test.dart
    - test/sources_test.dart
    - test/widget_test.dart
    - test/zakat_test.dart
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - always_declare_return_types
    - avoid_print
    - unawaited_futures
    - require_trailing_commas
